<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="64" fill="#ffffff"/>

  <!-- Classic garden tap / outdoor faucet style -->
  <!-- Back plate / wall flange -->
  <circle cx="180" cy="170" r="50" fill="none" stroke="#1a1a1a" stroke-width="6"/>
  <circle cx="180" cy="170" r="35" fill="none" stroke="#1a1a1a" stroke-width="4" opacity="0.4"/>
  <circle cx="180" cy="170" r="6" fill="#1a1a1a"/>
  <!-- Mounting screws -->
  <circle cx="150" cy="140" r="5" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="210" cy="200" r="5" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Tap body extending right -->
  <rect x="215" y="152" width="80" height="36" rx="5" fill="none" stroke="#1a1a1a" stroke-width="6"/>
  <!-- Thread rings on body -->
  <line x1="240" y1="152" x2="240" y2="188" stroke="#1a1a1a" stroke-width="3" opacity="0.3"/>
  <line x1="260" y1="152" x2="260" y2="188" stroke="#1a1a1a" stroke-width="3" opacity="0.3"/>

  <!-- Downward spout -->
  <path d="M290 188 L290 240 Q290 265 310 265 L345 265 Q365 265 365 285 L365 320"
        fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Spout nozzle -->
  <rect x="352" y="315" width="26" height="16" rx="3" fill="none" stroke="#1a1a1a" stroke-width="5"/>

  <!-- Wheel handle on top -->
  <line x1="310" y1="152" x2="310" y2="100" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
  <!-- Wheel -->
  <circle cx="310" cy="80" r="35" fill="none" stroke="#1a1a1a" stroke-width="8"/>
  <circle cx="310" cy="80" r="8" fill="#1a1a1a"/>
  <!-- Wheel spokes -->
  <line x1="310" y1="50" x2="310" y2="45" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <line x1="310" y1="110" x2="310" y2="115" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <line x1="280" y1="80" x2="275" y2="80" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <line x1="340" y1="80" x2="345" y2="80" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>

  <!-- Drips falling -->
  <circle cx="365" cy="348" r="5" fill="#1a1a1a"/>
  <circle cx="365" cy="365" r="3.5" fill="#1a1a1a" opacity="0.5"/>

  <!-- Big teardrop -->
  <path d="M365 385 C365 385 325 435 325 465 C325 492 342 508 365 508 C388 508 405 492 405 465 C405 435 365 385 365 385Z"
        fill="none" stroke="#1a1a1a" stroke-width="5.5"/>

  <!-- Minima logo inside drop - centered -->
  <g transform="translate(344.5,456) scale(1.0)">
    <polygon fill="#1a1a1a" points="32.8 10.1 31 17.9 28.8 8.5 20.9 5.3 18.7 14.7 16.8 3.7 8.9 .5 .7 36.5 9.4 36.5 11.9 25.5 13.8 36.5 22.4 36.5 24.6 27.1 26.8 36.5 35.5 36.5 40.7 13.3 32.8 10.1"/>
  </g>
</svg>
